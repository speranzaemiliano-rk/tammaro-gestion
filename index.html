<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tammaro · Gestión</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;1,700;1,800&family=Yellowtail&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8F9FA;--card:#fff;--bd:#DADCE0;--tx:#202124;--tx2:#5F6368;--pri:#E84820;--pri-d:#C23814;--gris:#A0A0A0;--marca:'Yellowtail','Brush Script MT',cursive;--rotulo:'Montserrat',system-ui,sans-serif;--ok:#188038;--mal:#D93025;--warn:#E37400}
@media (prefers-color-scheme:dark){:root{--bg:#171717;--card:#222;--bd:#3C4043;--tx:#E8EAED;--tx2:#9AA0A6;--pri:#FF7A4D;--pri-d:#FF9A74;--ok:#81C995;--mal:#F28B82;--warn:#FDD663}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:14px}
.oculto{display:none!important}
h1,h2,h3{margin:0}
h2{font-family:var(--marca);font-weight:400;font-size:34px;color:var(--pri);line-height:1.1}
h3{font-family:var(--rotulo);font-style:italic;font-weight:800;font-size:15px;letter-spacing:.04em;text-transform:uppercase}
th{font-family:var(--rotulo)!important;font-style:italic;font-weight:800!important;letter-spacing:.07em;text-transform:uppercase;font-size:11px!important}
nav button{font-family:var(--rotulo);font-style:italic;font-weight:700!important;letter-spacing:.03em}
.btn{font-family:var(--rotulo);font-style:italic;font-weight:800;letter-spacing:.03em}
.kpi b{font-family:var(--rotulo);font-style:italic;font-weight:800}
.kpi small:first-child{font-family:var(--rotulo);font-style:italic;font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:11px}
.marca{height:36px;display:block}
.logo-login{width:100%;max-width:280px;display:block;margin:0 auto 6px}
header{border-bottom:3px solid var(--pri)}
button{font:inherit;cursor:pointer}
.btn{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:9px 16px;font-weight:600}
.btn:hover{background:var(--pri-d)}
.btn.sec{background:transparent;color:var(--pri);border:1px solid var(--bd)}
.btn.mal{background:var(--mal)}
.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:9px 10px;width:100%}
label{display:block;font-size:12px;color:var(--tx2);margin:10px 0 4px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
/* pantallas de ingreso */
.centro{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.centro .card{width:100%;max-width:380px}
.err{color:var(--mal);font-size:13px;margin-top:10px;min-height:18px}
/* app */
header{background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;gap:8px}
.top b{font-size:16px}
nav{display:flex;gap:4px;overflow-x:auto;padding:0 12px 8px}
nav button{background:none;border:0;padding:8px 14px;border-radius:20px;color:var(--tx2);white-space:nowrap;font-weight:600}
nav button.act{background:var(--pri);color:#fff}
main{padding:16px;max-width:1100px;margin:0 auto}
.fila{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.fila .grow{flex:1;min-width:160px}
.fila select{width:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi small{color:var(--tx2);display:block;margin-bottom:6px}
.kpi b{font-size:24px}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:14px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:9px 10px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--tx2);position:sticky;top:0;background:var(--card)}
td.n,th.n{text-align:right}
td.nom{white-space:normal;min-width:200px;max-width:340px}
tr.clic{cursor:pointer}
tr.clic:hover td{background:rgba(232,72,32,.08)}
tfoot td{font-weight:700}
.pos{color:var(--ok)}.neg{color:var(--mal)}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:600;background:rgba(232,72,32,.14);color:var(--pri)}
.pill.ok{background:rgba(24,128,56,.14);color:var(--ok)}
.pill.mal{background:rgba(217,48,37,.14);color:var(--mal)}
.pill.warn{background:rgba(227,116,0,.16);color:var(--warn)}
.vacio{padding:28px;text-align:center;color:var(--tx2)}
.aviso{border-radius:10px;padding:10px 12px;margin-bottom:12px;background:rgba(227,116,0,.14);color:var(--tx)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.dos{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;margin-top:16px}
/* modal */
.fondo{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto;z-index:20}
.modal{background:var(--card);border-radius:14px;width:100%;max-width:560px;padding:20px;margin:auto}
.modal h3{margin-bottom:6px}
.prev{background:var(--bg);border:1px dashed var(--bd);border-radius:10px;padding:10px 12px;margin-top:12px;line-height:1.7}
.botones{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#202124;color:#fff;padding:10px 18px;border-radius:10px;z-index:50;max-width:90vw}
canvas{max-height:280px}
/* ---------- logo en 3D (capas apiladas del logo real) ---------- */
.l3d-wrap{width:100%;max-width:720px;margin:0 auto;touch-action:none;cursor:grab;user-select:none}
.l3d-wrap:active{cursor:grabbing}
.l3d-esc{perspective:1200px}
.l3d-obj{position:relative;width:100%;aspect-ratio:1202/446;transform-style:preserve-3d;will-change:transform}
.l3d-capa{position:absolute;inset:0;background:url(logo.png) center/contain no-repeat}
.l3d-sombra{width:68%;height:26px;margin:22px auto 0;background:radial-gradient(ellipse at center,rgba(232,72,32,.45),transparent 70%);filter:blur(8px)}
/* ---------- presentación del mes ---------- */
.pres{position:fixed;inset:0;z-index:100;color:#fff;overflow:hidden;font-family:var(--rotulo);background:radial-gradient(ellipse at 75% 15%,#4a1b09 0%,#1a1a1a 55%,#0d0d0d 100%)}
.pres .sl{position:absolute;inset:0 0 70px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5vh 6vw;text-align:center;opacity:0;transform:translateX(46px);pointer-events:none;transition:opacity .55s ease,transform .55s ease}
.pres .sl.act{opacity:1;transform:none;pointer-events:auto}
.pres .eti{font-style:italic;font-weight:800;font-size:clamp(11px,1.5vw,17px);letter-spacing:.38em;text-transform:uppercase;color:#A0A0A0}
.pres .gran{font-style:italic;font-weight:800;font-size:clamp(44px,10.5vw,150px);line-height:1.02;margin:2vh 0 1vh;color:#fff}
.pres .scr{font-family:var(--marca);color:#FF6A3D;font-weight:400}
.pres .sub{color:#c9c9c9;font-size:clamp(14px,1.9vw,22px);margin-top:1vh}
.pres .chip{display:inline-block;margin-top:2vh;padding:.5em 1.1em;border-radius:30px;font-weight:700;font-size:clamp(13px,1.7vw,20px);background:rgba(255,255,255,.1)}
.pres .chip.sube{color:#7be495}.pres .chip.baja{color:#ff8b82}
.pres .tres{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:3vw;width:100%;max-width:1100px;margin-top:4vh}
.pres .tres .gran{font-size:clamp(26px,4.4vw,66px);white-space:nowrap}
.pres .bars{width:100%;max-width:900px;margin-top:3vh;text-align:left}
.pres .bar{margin:1.6vh 0}
.pres .bar .t{display:flex;justify-content:space-between;gap:12px;font-size:clamp(12px,1.6vw,19px);margin-bottom:.6vh}
.pres .bar .t b{font-style:italic;font-weight:800;white-space:nowrap}
.pres .bar .p{height:clamp(10px,1.7vh,18px);background:rgba(255,255,255,.1);border-radius:20px;overflow:hidden}
.pres .bar .p i{display:block;height:100%;width:0;background:linear-gradient(90deg,#E84820,#ff8a5c);border-radius:20px;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.pres .bar .p i.gr{background:linear-gradient(90deg,#8c8c8c,#c4c4c4)}
.pres .ctl{position:absolute;left:0;right:0;bottom:0;height:70px;display:flex;align-items:center;justify-content:center;gap:14px;background:linear-gradient(transparent,rgba(0,0,0,.35))}
.pres .ctl button,.pres .ctl select{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:24px;padding:9px 16px;font:inherit;font-weight:700;width:auto}
.pres .ctl select option{color:#000}
.pres .ctl button:hover{background:rgba(232,72,32,.8)}
.pres .pts{display:flex;gap:8px}.pres .pts i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.3);transition:.3s}.pres .pts i.on{background:#E84820;width:26px;border-radius:6px}
.pres .cerrar{position:absolute;top:14px;right:14px;z-index:3;background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:50%;width:42px;height:42px;font-size:20px}
.pres .mini{max-width:min(340px,60vw)}
.acc{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.acc #quien{color:var(--tx2);font-size:12px;margin-right:4px}
.acc .btn{padding:7px 12px;font-size:13px}
@media(max-width:700px){.acc #quien{display:none}}
/* calendario */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dh{text-align:center;font-family:var(--rotulo);font-style:italic;font-weight:800;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gris);padding:4px 0}
.cal .dia{min-height:88px;border:1px solid var(--bd);border-radius:10px;background:var(--card);padding:6px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--tx);overflow:hidden}
.cal .dia.vacio{background:transparent;border:0;cursor:default}
.cal .dia.pos{background:rgba(24,128,56,.08)}.cal .dia.neg{background:rgba(217,48,37,.08)}
.cal .dia.hoy{outline:2px solid var(--pri)}
.cal .dia.sel{box-shadow:0 0 0 2px var(--pri) inset}
.cal .dia b{font-family:var(--rotulo);font-style:italic;font-weight:800;font-size:15px}
.cal .dia .fv{font-weight:700}
.cal .dia .gn{font-size:10px;color:var(--tx2)}
.cal .dia .ins{font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--pri);border-radius:6px;padding:1px 5px;align-self:flex-start}
.cal .dia .ins.cie{background:var(--gris)}
@media(max-width:560px){.cal{gap:3px}.cal .dia{min-height:58px;padding:4px}.cal .dia .gn{display:none}.cal .dia .fv{font-size:10px}}
.mesnav{display:flex;align-items:center;gap:8px}
.mesnav button{background:var(--card);border:1px solid var(--bd);border-radius:50%;width:34px;height:34px;font-size:16px;color:var(--tx)}
.mesnav strong{font-family:var(--marca);font-weight:400;font-size:26px;color:var(--pri);min-width:150px;text-align:center}
.barra{height:12px;background:var(--bd);border-radius:20px;overflow:hidden;margin:8px 0 4px}
.barra i{display:block;height:100%;background:var(--pri);border-radius:20px}
</style>
</head>
<body>

<!-- ============ PANTALLA: ingreso ============ -->
<div id="pLogin" class="centro oculto">
  <div class="card">
    <img class="logo-login" src="logo.png" alt="Tammaro Distribuidora">
    <p style="color:var(--tx2);margin:6px 0 0;text-align:center">Ingresá con tu usuario.</p>
    <div id="avisoConfig" class="aviso oculto" style="margin-top:12px">Falta pegar la configuración de Firebase en <code>index.html</code> (ver README).</div>
    <form id="formLogin">
      <label for="lgMail">Correo</label>
      <input id="lgMail" type="email" autocomplete="username" required>
      <label for="lgPass">Contraseña</label>
      <input id="lgPass" type="password" autocomplete="current-password" required>
      <div id="lgErr" class="err"></div>
      <button class="btn" style="width:100%" type="submit">Entrar</button>
    </form>
    <p style="text-align:center;margin:14px 0 0"><a href="#" id="lgOlvide" style="color:var(--pri)">Olvidé mi contraseña</a></p>
  </div>
</div>

<!-- ============ PANTALLA: sin rol todavía ============ -->
<div id="pPendiente" class="centro oculto">
  <div class="card">
    <h2>Cuenta pendiente de habilitar</h2>
    <p>Tu cuenta existe, pero todavía no tiene permisos. Pasale estos datos a quien administra el sistema:</p>
    <div class="prev"><b>Correo:</b> <span id="pdMail"></span><br><b>ID:</b> <span id="pdUid" style="word-break:break-all"></span></div>
    <div class="botones"><button class="btn sec" id="pdSalir">Salir</button></div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="pApp" class="oculto">
  <header>
    <div class="top">
      <img class="marca" src="logo.png" alt="Tammaro Distribuidora">
      <div class="acc"><span id="quien"></span><button class="btn sec oculto" id="btnSubir">📥 Subir Excel</button><button class="btn sec" id="btnExportar">📤 Exportar Excel</button><button class="btn sec" id="btnSalir">Salir</button></div>
    </div>
    <nav id="nav">
      <button data-t="Inicio" class="act">Inicio</button>
      <button data-t="Calendario">Calendario</button>
      <button data-t="Ventas">Ventas</button>
      <button data-t="Productos">Productos</button>
      <button data-t="Compras">Compras</button>
      <button data-t="Config">Configuración</button>
      <button data-t="Usuarios" id="navUsuarios" class="oculto">Usuarios</button>
    </nav>
  </header>
  <main>
    <section id="tInicio"></section>
    <section id="tCalendario" class="oculto"></section>
    <section id="tVentas" class="oculto"></section>
    <section id="tProductos" class="oculto"></section>
    <section id="tCompras" class="oculto"></section>
    <section id="tConfig" class="oculto"></section>
    <section id="tUsuarios" class="oculto"></section>
  </main>
</div>
<div id="modalRaiz"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

<script>
/* =====================================================================
   TAMMARO · GESTIÓN
   Un solo archivo, sin build. Datos en Firebase Realtime Database bajo
   la raíz "tammaro/". Quién entra lo decide "roles/<uid>" (admin|editor|lector).
   ===================================================================== */

// Configuración del proyecto Firebase «tammaro-gestion» (son datos públicos; los protegen las reglas)
var FIREBASE_CONFIG = {
  apiKey: 'AIzaSyCTtnyCGo18EqlzwwKNTSThXqpVQBqss2o',
  authDomain: 'tammaro-gestion.firebaseapp.com',
  databaseURL: 'https://tammaro-gestion-default-rtdb.firebaseio.com',
  projectId: 'tammaro-gestion',
  appId: '1:1002024231649:web:52617950cb8b59800e8da0'
};

var RAIZ = 'tammaro';
var DEF_CONFIG = { comClasica: 0.13, comPremium: 0.18, impuestos: 0.065, publicidad: 0, packaging: 111,
                   contadora: 50000, monotributo: 45000, margenObj: 0.2 };

var db = null, auth = null;
var rol = '';           // 'admin' | 'editor' | 'lector'
var S = { config: {}, productos: {}, ventas: {}, compras: {} };
var grafico = null;

/* ---------------- utilidades ---------------- */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
  return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); }
function num(v){ var n = parseFloat(v); return isFinite(n) ? n : 0; }
function r2(n){ return Math.round(n * 100) / 100; }
function money(n){ n = num(n); return (n < 0 ? '-$ ' : '$ ') + Math.abs(Math.round(n)).toLocaleString('es-AR'); }
function pct(n){ return (num(n) * 100).toFixed(1).replace('.', ',') + '%'; }
function hoyISO(){ var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function fechaCorta(iso){ if (!iso) return ''; var p = iso.split('-'); return p.length === 3 ? (+p[2]) + '/' + (+p[1]) + '/' + p[0] : iso; }
function mesDe(iso){ return (iso || '').slice(0, 7); }
function mesTexto(m){ if (!m) return ''; var p = m.split('-'); var n = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic']; return n[(+p[1]) - 1] + ' ' + p[0]; }
function toast(msg){ var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(function(){ t.remove(); }, 3200); }
function puedeEditar(){ return rol === 'admin' || rol === 'editor'; }
// Firebase no acepta undefined ni NaN: se sacan antes de guardar.
function limpiar(o){ var r = {}; Object.keys(o).forEach(function(k){ var v = o[k]; if (v === undefined || v === null || (typeof v === 'number' && !isFinite(v))) return; r[k] = v; }); return r; }
function lista(obj){ return Object.keys(obj || {}).map(function(k){ var o = obj[k]; o.id = k; return o; }); }

/* ---------------- cálculos (una sola fórmula para todo el sistema) ---------------- */
function cfg(){ var c = {}; Object.keys(DEF_CONFIG).forEach(function(k){ c[k] = (S.config && S.config[k] != null) ? num(S.config[k]) : DEF_CONFIG[k]; }); return c; }

// Producto: costo total, comisión, ganancia por unidad y precio sugerido.
function calcProd(p, tipoForzado){
  var c = cfg();
  var pack = p.packaging != null ? num(p.packaging) : c.packaging;
  var costoTotal = num(p.costo) + pack;
  // Si se pide otro tipo que el propio del producto, la comisión propia no aplica: se usa la de Configuración.
  var tipo = tipoForzado || p.tipo || 'Clasica';
  var propio = !tipoForzado || tipoForzado === (p.tipo || 'Clasica');
  var com = (propio && p.comision != null) ? num(p.comision) : (tipo === 'Premium' ? c.comPremium : c.comClasica);
  var mObj = p.margenObj != null ? num(p.margenObj) : c.margenObj;
  var varPct = com + c.impuestos + c.publicidad;
  var fijo = num(p.costoFijoML);
  var precio = num(p.precio);
  var gan = precio - fijo - precio * varPct - costoTotal;
  var den = 1 - varPct - mObj;
  return { tipo: tipo, pack: pack, costoTotal: costoTotal, com: com, mObj: mObj, varPct: varPct, fijo: fijo,
           gananciaU: gan, margen: precio ? gan / precio : 0,
           sugerido: den > 0 ? (costoTotal + fijo) / den : null };
}

// Venta: facturación = precio - comisión ML - impuestos + bonificaciones - envío.
// Ganancia = facturación - (costo + packaging) x cantidad.
function calcVenta(v){
  var fact = num(v.precio) - num(v.descMeli) - num(v.impuestos) + num(v.bonif) - num(v.envio);
  var costo = (num(v.costoU) + num(v.packU)) * num(v.cantidad);
  return { fact: fact, costo: costo, gan: fact - costo };
}

/* ---------------- arranque / sesión ---------------- */
function configurada(){ return FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.apiKey !== 'PEGAR_AQUI'; }
function pantalla(n){ ['pLogin','pPendiente','pApp'].forEach(function(id){ $(id).classList.toggle('oculto', id !== n); }); }

window.addEventListener('load', function(){
  if (!configurada()){ pantalla('pLogin'); $('avisoConfig').classList.remove('oculto'); $('formLogin').classList.add('oculto'); return; }
  firebase.initializeApp(FIREBASE_CONFIG);
  auth = firebase.auth(); db = firebase.database();
  auth.onAuthStateChanged(alCambiarSesion);
});

function alCambiarSesion(user){
  if (!user){ rol = ''; pantalla('pLogin'); return; }
  // Se anota el usuario (para que el admin lo vea en "Usuarios") y se pide el rol.
  db.ref('usuarios/' + user.uid).update({ email: user.email, ultimoAcceso: new Date().toISOString() }).catch(function(){});
  db.ref('roles/' + user.uid).once('value').then(function(s){
    rol = s.val() || '';
    if (!rol){ $('pdMail').textContent = user.email; $('pdUid').textContent = user.uid; pantalla('pPendiente'); return; }
    $('quien').textContent = user.email + ' · ' + rol;
    $('navUsuarios').classList.toggle('oculto', rol !== 'admin');
    $('btnSubir').classList.toggle('oculto', !puedeEditar());

// Carga con .once(): se lee una vez y se vuelve a leer después de cada cambio.
function cargarColeccion(n){ return db.ref(RAIZ + '/' + n).once('value').then(function(s){ S[n] = s.val() || {}; }); }
function cargarTodo(){ return Promise.all(['config','productos','ventas','compras'].map(cargarColeccion)); }

/* ---------------- navegación ---------------- */
var TABS = ['Inicio','Calendario','Ventas','Productos','Compras','Config','Usuarios'];
function irA(t){
  TABS.forEach(function(x){ $('t' + x).classList.toggle('oculto', x !== t); });
  Array.prototype.forEach.call($('nav').children, function(b){ b.classList.toggle('act', b.dataset.t === t); });
  ({ Inicio: pintarInicio, Calendario: pintarCalendario, Ventas: pintarVentas, Productos: pintarProductos, Compras: pintarCompras, Config: pintarConfig, Usuarios: pintarUsuarios })[t]();
}
$('nav').addEventListener('click', function(ev){ var b = ev.target.closest('button'); if (b) irA(b.dataset.t); });
function tabActual(){ for (var i = 0; i < TABS.length; i++) if (!$('t' + TABS[i]).classList.contains('oculto')) return TABS[i]; return 'Inicio'; }
function repintar(){ irA(tabActual()); }

/* ---------------- formulario genérico en ventana ----------------
   campos: {k, l, t:'text|number|date|select|pct|dato', opts, ph, lista}
   t:'pct' se muestra en % (12,5) y se guarda como fracción (0,125). */
function abrirForm(o){
  var vals = o.valores || {};
  var h = '<div class="fondo"><div class="modal"><h3>' + esc(o.titulo) + '</h3><div class="grid2">';
  o.campos.forEach(function(c){
    var v = vals[c.k];
    if (c.t === 'pct' && v != null && v !== '') v = r2(num(v) * 100);
    var ref = (c.t === 'dato' || c.t === 'number' || c.t === 'pct' || c.t === 'date' || c.t === 'text' || !c.t);
    h += '<div' + (c.ancho ? ' style="grid-column:1/-1"' : '') + '><label for="f_' + c.k + '">' + esc(c.l) + '</label>';
    if (c.t === 'select'){
      h += '<select id="f_' + c.k + '">' + c.opts.map(function(x){ return '<option' + (x === v ? ' selected' : '') + '>' + esc(x) + '</option>'; }).join('') + '</select>';
    } else if (c.t === 'area'){
      h += '<textarea id="f_' + c.k + '" rows="2">' + esc(v == null ? '' : v) + '</textarea>';
    } else {
      var tipo = (c.t === 'number' || c.t === 'pct') ? 'number' : (c.t === 'date' ? 'date' : 'text');
      h += '<input id="f_' + c.k + '" type="' + tipo + '"' + (tipo === 'number' ? ' step="any"' : '') +
           (c.lista ? ' list="' + c.lista + '"' : '') + (c.ph ? ' placeholder="' + esc(c.ph) + '"' : '') +
           ' value="' + esc(v == null ? '' : v) + '">';
    }
    h += '</div>';
  });
  h += '</div>' + (o.preview ? '<div class="prev" id="f_prev"></div>' : '') +
       '<div class="err" id="f_err"></div><div class="botones">' +
       (o.onBorrar ? '<button class="btn mal" id="f_borrar" style="margin-right:auto">Borrar</button>' : '') +
       '<button class="btn sec" id="f_cancel">Cancelar</button><button class="btn" id="f_ok">Guardar</button></div></div></div>';
  $('modalRaiz').innerHTML = h;

  function leer(){
    var r = {};
    o.campos.forEach(function(c){
      var e = $('f_' + c.k), v = e.value;
      if (c.t === 'number') r[c.k] = v === '' ? null : num(v);
      else if (c.t === 'pct') r[c.k] = v === '' ? null : num(v) / 100;
      else r[c.k] = v.trim();
    });
    return r;
  }
  function refrescar(){ if (o.preview) $('f_prev').innerHTML = o.preview(leer()); }
  var cerrar = function(){ $('modalRaiz').innerHTML = ''; };
  $('f_cancel').onclick = cerrar;
  $('f_ok').onclick = function(){
    var err = o.validar ? o.validar(leer()) : '';
    if (err){ $('f_err').textContent = err; return; }
    $('f_ok').disabled = true;
    Promise.resolve(o.onGuardar(leer())).then(cerrar).catch(function(e){ $('f_ok').disabled = false; $('f_err').textContent = 'No se pudo guardar: ' + e.message; });
  };
  if (o.onBorrar) $('f_borrar').onclick = function(){
    if (!confirm('¿Borrar este registro? No se puede deshacer.')) return;
    Promise.resolve(o.onBorrar()).then(cerrar).catch(function(e){ $('f_err').textContent = 'No se pudo borrar: ' + e.message; });
  };
  // Cuando el usuario escribe a mano en un campo, se marca para no pisarlo con autocompletados.
  o.campos.forEach(function(c){
    var e = $('f_' + c.k);
    e.addEventListener('input', function(){ e.dataset.mano = '1'; if (o.alCambiar) o.alCambiar(c.k, ayudas); refrescar(); });
    e.addEventListener('change', function(){ if (o.alCambiar) o.alCambiar(c.k, ayudas); refrescar(); });
  });
  var ayudas = {
    get: function(k){ return $('f_' + k).value; },
    set: function(k, v, forzar){ var e = $('f_' + k); if (forzar || !e.dataset.mano) e.value = v; },
    leer: leer
  };
  refrescar();
}

/* ====================================================================
   INICIO (resumen)
   ==================================================================== */
function pintarInicio(){
  var c = cfg();
  var ventas = lista(S.ventas), compras = lista(S.compras);
  var meses = {};
  ventas.forEach(function(v){ meses[mesDe(v.fecha)] = 1; });
  var mesesOrd = Object.keys(meses).filter(Boolean).sort();
  var sel = $('inMes') ? $('inMes').value : (mesesOrd[mesesOrd.length - 1] || '');
  if (sel !== 'todos' && mesesOrd.indexOf(sel) < 0) sel = mesesOrd[mesesOrd.length - 1] || 'todos';

  var vs = sel === 'todos' ? ventas : ventas.filter(function(v){ return mesDe(v.fecha) === sel; });
  var fact = 0, gan = 0, unid = 0;
  vs.forEach(function(v){ var k = calcVenta(v); fact += k.fact; gan += k.gan; unid += num(v.cantidad); });
  var prem = { n: 0, f: 0, g: 0 };
  vs.forEach(function(v){ if (v.tipo === 'Premium'){ var q = calcVenta(v); prem.n += num(v.cantidad); prem.f += q.fact; prem.g += q.gan; } });
  var nMeses = sel === 'todos' ? Math.max(mesesOrd.length, 1) : 1;
  var fijos = (c.contadora + c.monotributo) * nMeses;
  var neta = gan - fijos;
  var pend = compras.filter(function(x){ return x.estado === 'PENDIENTE'; }).reduce(function(a, x){ return a + num(x.cantidad) * num(x.costoU); }, 0);

  // Top productos por ganancia
  var porProd = {};
  vs.forEach(function(v){ var k = v.sku || v.producto || '?'; var p = porProd[k] || (porProd[k] = { sku: v.sku, nombre: v.producto, unid: 0, fact: 0, gan: 0 }); var q = calcVenta(v); p.unid += num(v.cantidad); p.fact += q.fact; p.gan += q.gan; });
  var top = Object.keys(porProd).map(function(k){ return porProd[k]; }).sort(function(a, b){ return b.gan - a.gan; }).slice(0, 8);

  var h = '<div class="fila"><h2 class="grow">Resumen</h2><button class="btn" id="inPres"' + (mesesOrd.length ? '' : ' disabled') + '>▶ Presentación del mes</button><button class="btn sec" id="inPdf"' + (mesesOrd.length ? '' : ' disabled') + '>📄 Informe PDF</button><select id="inMes">' +
    '<option value="todos"' + (sel === 'todos' ? ' selected' : '') + '>Todos los meses</option>' +
    mesesOrd.slice().reverse().map(function(m){ return '<option value="' + m + '"' + (m === sel ? ' selected' : '') + '>' + esc(mesTexto(m)) + '</option>'; }).join('') + '</select></div>';
  if (!ventas.length) h += '<div class="aviso">Todavía no hay ventas cargadas. Cargá la primera en <b>Ventas</b> o importá tu Excel desde <b>Configuración</b>.</div>';
  h += '<div class="kpis">' +
    kpi('Facturación', money(fact), 'lo que realmente te llega de ML') +
    kpi('Ganancia bruta', money(gan), unid + ' unidades vendidas') +
    kpi('Costos fijos', money(fijos), 'contadora + monotributo' + (sel === 'todos' ? ' × ' + nMeses + ' meses' : '')) +
    kpi('Ganancia neta', '<span class="' + (neta >= 0 ? 'pos' : 'neg') + '">' + money(neta) + '</span>', fact ? 'margen ' + pct(neta / fact) : '') +
    kpi('Ventas Premium', prem.n + ' u.', prem.n ? money(prem.f) + ' facturados · ganancia ' + money(prem.g) : 'ninguna en este período') +
    kpi('Compras pendientes de pago', money(pend), 'a proveedores') + '</div>';
  h += '<div class="dos"><div class="card"><h3 style="margin-bottom:10px">Por mes</h3><canvas id="cvMes"></canvas></div>' +
       '<div class="card"><h3 style="margin-bottom:10px">Productos que más ganancia dejan</h3>' +
       (top.length ? '<table style="min-width:0"><tbody>' + top.map(function(p){ return '<tr><td class="nom">' + esc(p.nombre || p.sku) + '<br><small style="color:var(--tx2)">' + esc(p.sku) + ' · ' + p.unid + ' u.</small></td><td class="n"><b>' + money(p.gan) + '</b></td></tr>'; }).join('') + '</tbody></table>' : '<div class="vacio">Sin datos</div>') +
       '</div></div>';
  $('tInicio').innerHTML = h;
  $('inMes').onchange = pintarInicio;
  $('inPdf').onclick = function(){ informePDF(sel); };
  $('inPres').onclick = function(){ presentarMes(sel === 'todos' ? mesesOrd[mesesOrd.length - 1] : sel); };

  // Gráfico: facturación y ganancia por mes (siempre todos los meses, para comparar).
  var porMes = {};
  ventas.forEach(function(v){ var m = mesDe(v.fecha); if (!m) return; var q = calcVenta(v); var o = porMes[m] || (porMes[m] = { f: 0, g: 0 }); o.f += q.fact; o.g += q.gan; });
  var ms = Object.keys(porMes).sort();
  if (grafico){ grafico.destroy(); grafico = null; }
  if (ms.length && window.Chart){
    var oscuro = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
    grafico = new Chart($('cvMes'), { type: 'bar',
      data: { labels: ms.map(mesTexto), datasets: [
        { label: 'Facturación', data: ms.map(function(m){ return Math.round(porMes[m].f); }), backgroundColor: '#A0A0A0' },
        { label: 'Ganancia bruta', data: ms.map(function(m){ return Math.round(porMes[m].g); }), backgroundColor: oscuro ? '#FF7A4D' : '#E84820' } ] },
      options: { responsive: true, plugins: { legend: { position: 'bottom' } },
        scales: { y: { ticks: { callback: function(v){ return '$ ' + v.toLocaleString('es-AR'); } } } } } });
  }
}
function kpi(t, v, sub){ return '<div class="card kpi"><small>' + esc(t) + '</small><b>' + v + '</b><small style="margin:6px 0 0">' + esc(sub || '') + '</small></div>'; }

function proximoNro(){ var m = 0; lista(S.ventas).forEach(function(v){ m = Math.max(m, num(v.nro)); }); return m + 1; }

function formVenta(id){
  var v = id ? S.ventas[id] : { fecha: hoyISO(), cantidad: 1, nro: proximoNro(), tipo: 'Clasica' };
  if (!v.tipo) v.tipo = (productoPorSku(v.sku) || {}).tipo || 'Clasica';   // ventas viejas sin tipo
  var c = cfg();
  var costoU = v.costoU, packU = v.packU;           // se guardan en la venta: si después cambia el costo, el historial no se mueve
  abrirForm({
    titulo: id ? 'Venta N° ' + v.nro : 'Nueva venta',
    valores: v,
    campos: [
      { k: 'fecha', l: 'Fecha', t: 'date' }, { k: 'nro', l: 'N° de venta', t: 'number' },
      { k: 'sku', l: 'SKU (elegí de la lista)', lista: 'dlSku' }, { k: 'cantidad', l: 'Cantidad', t: 'number' },
      { k: 'producto', l: 'Producto', ancho: true },
      { k: 'tipo', l: 'Publicación', t: 'select', opts: ['Clasica', 'Premium'] },
      { k: 'precio', l: 'Precio de venta total ($)', t: 'number' }, { k: 'descMeli', l: 'Comisión de ML ($)', t: 'number' },
      { k: 'impuestos', l: 'Impuestos ($)', t: 'number' }, { k: 'bonif', l: 'Bonificaciones de ML ($)', t: 'number' },
      { k: 'envio', l: 'Envío ($)', t: 'number' }
    ],
    alCambiar: function(k, a){
      if (k === 'sku'){
        var p = productoPorSku(a.get('sku').trim());
        if (p){ var kp = calcProd(p); a.set('producto', p.nombre, true); a.set('tipo', p.tipo || 'Clasica', true); costoU = num(p.costo); packU = kp.pack;
                if (p.precio) a.set('precio', num(p.precio) * (num(a.get('cantidad')) || 1)); }
      }
      if (k === 'sku' || k === 'precio' || k === 'cantidad' || k === 'tipo'){
        // Estimación inicial de comisión e impuestos (se puede pisar a mano con el dato real de ML).
        var pr = num(a.get('precio')), p2 = productoPorSku(a.get('sku').trim());
        var tipoV = a.get('tipo');
        var com = p2 ? calcProd(p2, tipoV).com : (tipoV === 'Premium' ? c.comPremium : c.comClasica);
        a.set('descMeli', r2(pr * com)); a.set('impuestos', r2(pr * c.impuestos));
      }
    },
    preview: function(x){
      var tmp = { precio: x.precio, descMeli: x.descMeli, impuestos: x.impuestos, bonif: x.bonif, envio: x.envio, cantidad: x.cantidad,
                  costoU: costoU != null ? costoU : costoDe(x.sku), packU: packU != null ? packU : c.packaging };
      var k = calcVenta(tmp);
      return 'Facturación: <b>' + money(k.fact) + '</b> · Costo: <b>' + money(k.costo) + '</b> · Ganancia: <b class="' + (k.gan >= 0 ? 'pos' : 'neg') + '">' + money(k.gan) + '</b>' +
             (num(x.precio) ? ' (' + pct(k.gan / num(x.precio)) + ' del precio)' : '') +
             (tmp.costoU ? '' : '<br><small>⚠️ No encuentro el costo de este SKU: la ganancia no descuenta el producto.</small>');
    },
    validar: function(x){ if (!x.fecha) return 'Falta la fecha.'; if (!x.producto && !x.sku) return 'Falta el producto.'; if (!(num(x.cantidad) > 0)) return 'La cantidad tiene que ser mayor a 0.'; if (x.precio == null) return 'Falta el precio.'; return ''; },
    onGuardar: function(x){
      var p = productoPorSku(x.sku);
      if (costoU == null) costoU = p ? num(p.costo) : 0;
      if (packU == null) packU = p ? calcProd(p).pack : c.packaging;
      x.costoU = costoU; x.packU = packU;
      ['descMeli','impuestos','bonif','envio'].forEach(function(k){ if (x[k] == null) x[k] = 0; });
      var ref = id ? db.ref(RAIZ + '/ventas/' + id) : db.ref(RAIZ + '/ventas').push();
      return ref.set(limpiar(x)).then(function(){ return cargarColeccion('ventas'); }).then(repintar);
    },
    onBorrar: id && rol === 'admin' ? function(){ return db.ref(RAIZ + '/ventas/' + id).remove().then(function(){ return cargarColeccion('ventas'); }).then(repintar); } : null
  });
  $('modalRaiz').insertAdjacentHTML('beforeend', datalistProductos());
}

// ---- Lectura del Excel (función pura: recibe el libro y devuelve los datos) ----
function serialAISO(s){ if (typeof s === 'number') return new Date(Math.round((s - 25569) * 86400000)).toISOString().slice(0, 10); if (s instanceof Date) return s.toISOString().slice(0, 10); return ''; }
function filasHoja(XL, wb, nombre){ var ws = wb.Sheets[nombre]; return ws ? XL.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null }) : null; }
function leerExcel(XL, wb, packDefecto){
  var out = { productos: [], ventas: [], compras: [], avisos: [] };
  var fp = filasHoja(XL, wb, 'Productos'), fv = filasHoja(XL, wb, 'Ventas'), fc = filasHoja(XL, wb, 'Proveedores');
  if (!fp) out.avisos.push('No encontré la hoja «Productos».');
  if (!fv) out.avisos.push('No encontré la hoja «Ventas».');
  if (!fc) out.avisos.push('No encontré la hoja «Proveedores».');
  var porSku = {};
  (fp || []).slice(1).forEach(function(r){
    if (!r[0] || !r[2] || typeof r[3] !== 'number') return;
    var p = { sku: String(r[0]).trim(), nombre: String(r[2]).trim(), costo: r[3], tipo: r[6] === 'Premium' ? 'Premium' : 'Clasica' };
    if (typeof r[4] === 'number' && r[4] !== packDefecto) p.packaging = r[4];
    if (typeof r[7] === 'number') p.comision = r[7];
    if (typeof r[14] === 'number') p.costoFijoML = r[14];
    if (typeof r[15] === 'number') p.margenObj = r[15];
    if (typeof r[16] === 'number') p.precio = r[16];
    if (porSku[p.sku]) out.avisos.push('SKU repetido en Productos: ' + p.sku + ' (se importan los dos; revisalo).');
    porSku[p.sku] = p; out.productos.push(p);
  });
  (fv || []).slice(1).forEach(function(r){
    var fecha = serialAISO(r[1]); if (!fecha || typeof r[5] !== 'number') return;
    var cant = typeof r[4] === 'number' && r[4] > 0 ? r[4] : 1, sku = r[2] ? String(r[2]).trim() : '';
    var pr = porSku[sku];
    var costoTotal = typeof r[6] === 'number' ? r[6] : (pr ? pr.costo * cant : 0);
    out.ventas.push({ nro: r[0], fecha: fecha, sku: sku, producto: r[3] ? String(r[3]).trim() : (pr ? pr.nombre : ''), cantidad: cant, precio: r[5],
      tipo: (r[13] === 'Premium' || r[13] === 'Clasica') ? r[13] : (pr ? pr.tipo : 'Clasica'), descMeli: num(r[7]), impuestos: num(r[8]), bonif: num(r[9]), envio: num(r[10]), costoU: r2(costoTotal / cant), packU: pr && pr.packaging != null ? pr.packaging : packDefecto });
  });
  (fc || []).slice(1).forEach(function(r){
    var fecha = serialAISO(r[0]); if (!fecha || typeof r[4] !== 'number') return;
    var c = { fecha: fecha, sku: r[1] ? String(r[1]).trim() : '', producto: r[2] ? String(r[2]).trim() : '', cantidad: typeof r[3] === 'number' ? r[3] : 1, costoU: r[4],
              estado: String(r[7] || '').toUpperCase() === 'PAGADO' ? 'PAGADO' : 'PENDIENTE' };
    if (r[8]) c.nota = String(r[8]).trim();
    out.compras.push(c);
  });
  return out;
}

/* ====================================================================
   SUBIR EXCEL (ventana): suma solo lo nuevo o reemplaza todo
   ==================================================================== */
var impDatos = null, impPlan = null;
function claveProd(p){ return String(p.sku || '').trim().toLowerCase() + '|' + String(p.nombre || '').trim().toLowerCase(); }
function claveVenta(v){ return [v.fecha, v.nro, String(v.sku || '').trim().toLowerCase(), num(v.cantidad), r2(num(v.precio))].join('|'); }
function claveCompra(x){ return [x.fecha, String(x.sku || '').trim().toLowerCase(), num(x.cantidad), r2(num(x.costoU))].join('|'); }
var CAMPOS_PROD = ['costo', 'precio', 'tipo', 'comision', 'costoFijoML', 'margenObj', 'packaging'];
// Decide qué se agrega, qué ya estaba y qué productos cambian de costo/precio.
function planImport(d, modo, actualizar){
  var plan = { prod: { nuevos: [], upd: [], ya: 0 }, ven: { nuevas: [], ya: 0 }, com: { nuevas: [], ya: 0 } };
  if (modo === 'reemplazar'){ plan.prod.nuevos = d.productos; plan.ven.nuevas = d.ventas; plan.com.nuevas = d.compras; return plan; }
  var ep = {}; lista(S.productos).forEach(function(p){ ep[claveProd(p)] = p; });
  d.productos.forEach(function(p){
    var k = claveProd(p), e = ep[k];
    if (!e){ plan.prod.nuevos.push(p); ep[k] = { sinId: true }; return; }
    plan.prod.ya++;
    if (actualizar && e.id){
      var cambios = {}; CAMPOS_PROD.forEach(function(f){ if (p[f] != null && p[f] !== e[f]) cambios[f] = p[f]; });
      if (Object.keys(cambios).length) plan.prod.upd.push({ id: e.id, cambios: cambios });
    }
  });
  var ev = {}; lista(S.ventas).forEach(function(v){ ev[claveVenta(v)] = 1; });
  d.ventas.forEach(function(v){ var k = claveVenta(v); if (ev[k]) plan.ven.ya++; else { plan.ven.nuevas.push(v); ev[k] = 1; } });
  var ec = {}; lista(S.compras).forEach(function(x){ ec[claveCompra(x)] = 1; });
  d.compras.forEach(function(x){ var k = claveCompra(x); if (ec[k]) plan.com.ya++; else { plan.com.nuevas.push(x); ec[k] = 1; } });
  return plan;
}
function abrirImportar(){
  if (!puedeEditar()){ toast('Tu rol no permite cargar datos.'); return; }
  impDatos = null; impPlan = null;
  $('modalRaiz').innerHTML = '<div class="fondo"><div class="modal"><h3>Subir Excel</h3>' +
    '<p style="color:var(--tx2);margin:6px 0 0">Elegí el Excel con las hojas <b>Productos</b>, <b>Ventas</b> y <b>Proveedores</b>: el de tu Tablero o el que baja «Exportar». El archivo original no se modifica.</p>' +
    '<input type="file" id="impArchivo" accept=".xlsx,.xls" style="margin-top:12px"><div id="impInfo" class="prev oculto"></div>' +
    '<label style="display:flex;gap:8px;align-items:flex-start;color:var(--tx);margin-top:12px"><input type="radio" name="impModo" value="nuevo" checked style="width:auto;margin-top:3px"><span><b>Sumar solo lo nuevo</b> (recomendado): lo que ya cargaste no se repite.</span></label>' +
    '<label style="display:flex;gap:8px;align-items:flex-start;color:var(--tx);margin-top:6px"><input type="radio" name="impModo" value="reemplazar" style="width:auto;margin-top:3px"><span><b>Reemplazar todo</b>: borra lo que hay y deja lo del Excel.</span></label>' +
    '<label style="display:flex;gap:8px;align-items:flex-start;color:var(--tx);margin-top:12px"><input type="checkbox" id="impAct" checked style="width:auto;margin-top:3px"><span>Actualizar costos y precios de los productos que ya existen</span></label>' +
    '<div class="err" id="impErr"></div><div class="botones"><button class="btn sec" id="impCancel">Cancelar</button><button class="btn" id="impOk" disabled>Importar</button></div></div></div>';
  $('impCancel').onclick = function(){ $('modalRaiz').innerHTML = ''; };
  function modo(){ return document.querySelector('input[name=impModo]:checked').value; }
  function refrescar(){
    if (!impDatos) return;
    impPlan = planImport(impDatos, modo(), $('impAct').checked);
    var p = impPlan, i = $('impInfo'); i.classList.remove('oculto');

      ? 'Se cargarán <b>' + p.prod.nuevos.length + '</b> productos, <b>' + p.ven.nuevas.length + '</b> ventas y <b>' + p.com.nuevas.length + '</b> compras. <b>Lo que hay hoy se borra.</b>'
      : 'Productos: <b>' + p.prod.nuevos.length + '</b> nuevos' + (p.prod.ya ? ', ' + p.prod.ya + ' ya existían' + (p.prod.upd.length ? ' (' + p.prod.upd.length + ' con costo/precio distinto)' : '') : '') + '<br>' +
        'Ventas: <b>' + p.ven.nuevas.length + '</b> nuevas' + (p.ven.ya ? ', ' + p.ven.ya + ' repetidas (se saltean)' : '') + '<br>' +
        'Compras: <b>' + p.com.nuevas.length + '</b> nuevas' + (p.com.ya ? ', ' + p.com.ya + ' repetidas (se saltean)' : '');
    if (impDatos.avisos.length) i.innerHTML += '<br><small>' + impDatos.avisos.slice(0, 5).map(esc).join('<br>') + '</small>';
    $('impOk').disabled = rem ? !(p.prod.nuevos.length || p.ven.nuevas.length || p.com.nuevas.length) : !(p.prod.nuevos.length || p.prod.upd.length || p.ven.nuevas.length || p.com.nuevas.length);
  }
  Array.prototype.forEach.call(document.querySelectorAll('input[name=impModo], #impAct'), function(e){ e.onchange = refrescar; });
  $('impArchivo').onchange = function(){
    var f = this.files[0]; if (!f) return; $('impErr').textContent = '';
    var rd = new FileReader();
    rd.onload = function(){
      try { impDatos = leerExcel(XLSX, XLSX.read(new Uint8Array(rd.result), { type: 'array' }), cfg().packaging); refrescar(); }
      catch (e){ $('impErr').textContent = 'No pude leer el Excel: ' + e.message; }
    };
    rd.readAsArrayBuffer(f);
  };
  $('impOk').onclick = function(){
    if (!impPlan) return;
    var rem = modo() === 'reemplazar';
    if (rem && !confirm('Esto BORRA todos los productos, ventas y compras actuales y los reemplaza por el Excel. ¿Seguimos?')) return;
    $('impOk').disabled = true; var pl = impPlan, trabajo;
    if (rem){
      trabajo = Promise.all([['productos', pl.prod.nuevos], ['ventas', pl.ven.nuevas], ['compras', pl.com.nuevas]].map(function(par){
        if (!par[1].length) return Promise.resolve();
        var obj = {}; par[1].forEach(function(x){ obj[db.ref(RAIZ + '/' + par[0]).push().key] = limpiar(x); });
        return db.ref(RAIZ + '/' + par[0]).set(obj);
      }));
    } else {
      var up = {};
      [['productos', pl.prod.nuevos], ['ventas', pl.ven.nuevas], ['compras', pl.com.nuevas]].forEach(function(par){
        par[1].forEach(function(x){ up[RAIZ + '/' + par[0] + '/' + db.ref(RAIZ + '/' + par[0]).push().key] = limpiar(x); });
      });
      pl.prod.upd.forEach(function(u){ Object.keys(u.cambios).forEach(function(f){ up[RAIZ + '/productos/' + u.id + '/' + f] = u.cambios[f]; }); });
      trabajo = Object.keys(up).length ? db.ref().update(up) : Promise.resolve();
    }
    trabajo.then(cargarTodo).then(function(){
      $('modalRaiz').innerHTML = '';
      toast(rem ? 'Importación lista' : 'Listo: ' + pl.ven.nuevas.length + ' ventas, ' + pl.com.nuevas.length + ' compras y ' + pl.prod.nuevos.length + ' productos nuevos');
      repintar();
    }).catch(function(e){ $('impErr').textContent = 'Falló la importación: ' + e.message; $('impOk').disabled = false; });
  };
}

/* ====================================================================
   EXPORTAR A EXCEL: mismas hojas que el importador (se puede volver a subir)
   ==================================================================== */
function fechaSerial(iso){ var p = (iso || '').split('-'); return p.length === 3 ? Math.round(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 86400000) + 25569 : ''; }
function hojaDe(filas, colFecha){
  var ws = XLSX.utils.aoa_to_sheet(filas);
  if (colFecha != null) for (var r = 1; r < filas.length; r++){ var c = ws[XLSX.utils.encode_cell({ r: r, c: colFecha })]; if (c && typeof c.v === 'number') c.z = 'dd/mm/yyyy'; }
  ws['!cols'] = filas[0].map(function(h, i){ return { wch: i === 2 || i === 3 ? 42 : 14 }; });
  return ws;
}
function exportarExcel(){
  if (!window.XLSX){ toast('No se pudo cargar el generador de Excel.'); return; }
  var wb = XLSX.utils.book_new();
  var ps = lista(S.productos).sort(function(a, b){ return String(a.sku).localeCompare(String(b.sku)); });
  var fp = [['SKU', 'Foto', 'Producto', 'Costo Producto', 'Packaging', 'Costo Total', 'Tipo Publicacion', 'Comision', '', 'Impuestos', '', 'Publicidad', '', 'Envio gratis', 'Costo Fijo ML', 'Margen Objetivo', 'Precio de venta', 'Ganancia por unidad', 'Margen', 'Sugerido Clasica', 'Sugerido Premium']];
  ps.forEach(function(p){ var k = calcProd(p), kc = calcProd(p, 'Clasica'), kp = calcProd(p, 'Premium');
    fp.push([p.sku, '', p.nombre, num(p.costo), k.pack, r2(k.costoTotal), p.tipo || 'Clasica', k.com, '', cfg().impuestos, '', cfg().publicidad, '', '', num(p.costoFijoML), k.mObj, num(p.precio), r2(k.gananciaU), r2(k.margen), kc.sugerido ? r2(kc.sugerido) : '', kp.sugerido ? r2(kp.sugerido) : '']); });
  XLSX.utils.book_append_sheet(wb, hojaDe(fp), 'Productos');
  var vs = lista(S.ventas).sort(function(a, b){ return String(a.fecha).localeCompare(String(b.fecha)) || num(a.nro) - num(b.nro); });

/* ====================================================================
   CALENDARIO (con el inicio de mes y el punto de equilibrio)
   ==================================================================== */
var calMes = '', calDia = 0;
function diasEnMes(m){ var p = m.split('-'); return new Date(+p[0], +p[1], 0).getDate(); }
function sumarMes(m, d){ var p = m.split('-'), y = +p[0], mm = +p[1] + d; while (mm < 1){ mm += 12; y--; } while (mm > 12){ mm -= 12; y++; } return y + '-' + String(mm).padStart(2, '0'); }
function corto(n){ n = Math.round(n); var a = Math.abs(n), t = a >= 1e6 ? (a / 1e6).toFixed(1).replace('.', ',') + 'M' : (a >= 1e3 ? Math.round(a / 1e3) + 'k' : String(a)); return (n < 0 ? '-' : '') + '$' + t; }
function pintarCalendario(){
  if (!calMes) calMes = mesDe(hoyISO());
  var m = calMes, p = m.split('-'), nd = diasEnMes(m), primero = (new Date(+p[0], +p[1] - 1, 1).getDay() + 6) % 7;
  var hoy = hoyISO(), esActual = mesDe(hoy) === m, esFuturo = m > mesDe(hoy);
  var vs = lista(S.ventas).filter(function(v){ return mesDe(v.fecha) === m; });
  var cs = lista(S.compras).filter(function(x){ return mesDe(x.fecha) === m; });
  var porDia = {};
  function dia(d){ return porDia[d] || (porDia[d] = { n: 0, u: 0, f: 0, g: 0, c: 0 }); }
  vs.forEach(function(v){ var o = dia(+v.fecha.slice(8, 10)), k = calcVenta(v); o.n++; o.u += num(v.cantidad); o.f += k.fact; o.g += k.gan; });
  cs.forEach(function(x){ dia(+x.fecha.slice(8, 10)).c++; });
  var r = resumenMes(m), a = resumenMes(sumarMes(m, -1));
  var falta = Math.max(0, r.fijos - r.gan), gv = r.n ? r.gan / r.n : (a.n ? a.gan / a.n : 0);
  var ventasNec = falta > 0 && gv > 0 ? Math.ceil(falta / gv) : 0;
  var pcub = r.fijos ? Math.min(100, Math.max(0, r.gan / r.fijos * 100)) : 0;
  var mt = mesTexto(m);
  var h = '<div class="fila"><h2 class="grow">Calendario</h2><div class="mesnav"><button id="calPrev">‹</button><strong>' + esc(mt.charAt(0).toUpperCase() + mt.slice(1)) + '</strong><button id="calNext">›</button></div>' +
    '<button class="btn sec" id="calHoy">Hoy</button><button class="btn sec" id="calPdf"' + (r.n || r.compras ? '' : ' disabled') + '>📄 Informe PDF</button><button class="btn" id="calPres"' + (r.n ? '' : ' disabled') + '>▶ Presentación</button></div>';
  // ---- Inicio de mes ----

    '<p style="margin:0 0 6px;color:var(--tx2)">Cómo cerró ' + esc(mesTexto(sumarMes(m, -1))) + ':</p>' +
    (a.n ? '<div>Facturación <b>' + money(a.fact) + '</b> · Ganancia bruta <b>' + money(a.gan) + '</b> · Ganancia neta <b class="' + (a.neta >= 0 ? 'pos' : 'neg') + '">' + money(a.neta) + '</b></div>' : '<div style="color:var(--tx2)">Sin ventas cargadas ese mes.</div>') +
    '</div><div class="card"><h3 style="margin-bottom:8px">Para cubrir los costos fijos</h3>' +

    '<div class="barra"><i style="width:' + pcub.toFixed(0) + '%"></i></div>' +

  $('calPrev').onclick = function(){ calMes = sumarMes(calMes, -1); calDia = 0; pintarCalendario(); };
  $('calNext').onclick = function(){ calMes = sumarMes(calMes, 1); calDia = 0; pintarCalendario(); };
  $('calHoy').onclick = function(){ calMes = mesDe(hoyISO()); calDia = +hoyISO().slice(8, 10); pintarCalendario(); };
  $('calPdf').onclick = function(){ informePDF(calMes); };
  $('calPres').onclick = function(){ presentarMes(calMes); };

/* ====================================================================
   LOGO 3D: apila varias copias del logo real con profundidad (CSS 3D),
   lo mueve solo con un vaivén y se puede girar arrastrando.
   ==================================================================== */
function logo3D(wrap){
  var N = 26, paso = 1.8;
  wrap.classList.add('l3d-wrap');
  wrap.innerHTML = '<div class="l3d-esc"><div class="l3d-obj"></div><div class="l3d-sombra"></div></div>';
  var obj = wrap.querySelector('.l3d-obj'), h = '';
  for (var i = N; i >= 0; i--){                       // se dibuja de atrás hacia adelante
    var br = i === 0 ? 1 : 0.78 - 0.42 * (i / N);     // el frente brilla, el fondo oscurece
    h += '<div class="l3d-capa" style="transform:translateZ(' + (-i * paso) + 'px);filter:brightness(' + br.toFixed(2) + ')"></div>';
  }
  obj.innerHTML = h;
  var ry = 0, rx = -6, arrastrando = false, ult = 0, x0 = 0, y0 = 0, t0 = performance.now();
  function cuadro(t){
    if (!wrap.isConnected) return;
    if (!arrastrando && t - ult > 2200){ ry = 34 * Math.sin((t - t0) / 1700); rx = -6 + 5 * Math.sin((t - t0) / 2300); }
    obj.style.transform = 'rotateX(' + rx.toFixed(1) + 'deg) rotateY(' + ry.toFixed(1) + 'deg)';
    requestAnimationFrame(cuadro);
  }
  wrap.addEventListener('pointerdown', function(e){ arrastrando = true; x0 = e.clientX; y0 = e.clientY; try { wrap.setPointerCapture(e.pointerId); } catch (_){} });
  wrap.addEventListener('pointermove', function(e){ if (!arrastrando) return; ry += (e.clientX - x0) * 0.6; rx = Math.max(-40, Math.min(40, rx - (e.clientY - y0) * 0.4)); x0 = e.clientX; y0 = e.clientY; ult = performance.now(); });
  function soltar(){ arrastrando = false; ult = performance.now(); ry = ((ry % 360) + 360) % 360; if (ry > 180) ry -= 360; }
  wrap.addEventListener('pointerup', soltar); wrap.addEventListener('pointercancel', soltar);
  requestAnimationFrame(cuadro);
}

/* ====================================================================
   PRESENTACIÓN DEL MES (pantalla completa, con flechas o deslizando)
   ==================================================================== */
var P = null;
function resumenMes(m){
  var c = cfg(), vs = lista(S.ventas).filter(function(v){ return mesDe(v.fecha) === m; });
  var r = { m: m, n: vs.length, unid: 0, fact: 0, gan: 0, prem: { n: 0, f: 0, g: 0 }, clas: { n: 0, f: 0, g: 0 }, prods: {} };
  vs.forEach(function(v){
    var k = calcVenta(v), u = num(v.cantidad); r.unid += u; r.fact += k.fact; r.gan += k.gan;
    var g = v.tipo === 'Premium' ? r.prem : r.clas; g.n += u; g.f += k.fact; g.g += k.gan;
    var id = v.sku || v.producto || '?', p = r.prods[id] || (r.prods[id] = { nombre: v.producto || v.sku, unid: 0, gan: 0 });
    p.unid += u; p.gan += k.gan;
  });
  r.fijos = c.contadora + c.monotributo; r.neta = r.gan - r.fijos;
  r.top = Object.keys(r.prods).map(function(k){ return r.prods[k]; }).sort(function(a, b){ return b.gan - a.gan; }).slice(0, 5);
  var cs = lista(S.compras).filter(function(x){ return mesDe(x.fecha) === m; });
  r.compras = cs.reduce(function(a, x){ return a + num(x.cantidad) * num(x.costoU); }, 0); r.nCompras = cs.length;
  var pend = lista(S.compras).filter(function(x){ return x.estado === 'PENDIENTE'; });
  r.pend = pend.reduce(function(a, x){ return a + num(x.cantidad) * num(x.costoU); }, 0); r.nPend = pend.length;
  return r;
}
function mesAnterior(m){ var p = m.split('-'), y = +p[0], mm = +p[1] - 1; if (mm < 1){ mm = 12; y--; } return y + '-' + String(mm).padStart(2, '0'); }
function chipVar(act, ant, etiqueta){
  if (!ant) return '';
  var d = (act - ant) / Math.abs(ant), sube = d >= 0;
  return '<div class="chip ' + (sube ? 'sube' : 'baja') + '">' + (sube ? '▲ ' : '▼ ') + Math.abs(d * 100).toFixed(0) + '% vs ' + esc(etiqueta) + '</div>';
}
function chipDif(act, ant, etiqueta){
  if (ant == null) return '';
  var d = act - ant, sube = d >= 0;
  return '<div class="chip ' + (sube ? 'sube' : 'baja') + '">' + (sube ? '▲ +' : '▼ -') + money(Math.abs(d)).replace('$ ', '$ ') + ' vs ' + esc(etiqueta) + '</div>';
}
function slidesDe(m){
  var r = resumenMes(m), a = resumenMes(mesAnterior(m)), tieneAnt = a.n > 0, ant = mesTexto(mesAnterior(m));
  var mt = mesTexto(m), mtc = mt.charAt(0).toUpperCase() + mt.slice(1);
  var tk = r.n ? r.fact / r.n : 0, totPrem = r.prem.f + r.clas.f;
  var s = [];
  s.push('<div class="eti">Presentación del mes</div><div class="l3d-slot" style="width:100%;margin:3vh 0 2vh"></div><div class="gran scr" style="font-size:clamp(34px,6vw,84px)">' + esc(mtc) + '</div>');
  s.push('<div class="eti">Facturación</div><div class="gran" data-n="' + Math.round(r.fact) + '" data-f="money">$ 0</div>' +
    chipVar(r.fact, tieneAnt ? a.fact : 0, ant) +
    '<div class="sub">' + r.n + ' ventas · ' + r.unid + ' unidades · ticket promedio ' + money(tk) + '</div>');
  s.push('<div class="eti">Resultado del mes</div><div class="tres">' +
    '<div><div class="eti">Ganancia bruta</div><div class="gran" data-n="' + Math.round(r.gan) + '" data-f="money">$ 0</div></div>' +
    '<div><div class="eti">Costos fijos</div><div class="gran" data-n="' + Math.round(r.fijos) + '" data-f="money" style="color:#A0A0A0">$ 0</div></div>' +
    '<div><div class="eti">Ganancia neta</div><div class="gran" data-n="' + Math.round(r.neta) + '" data-f="money" style="color:' + (r.neta >= 0 ? '#7be495' : '#ff8b82') + '">$ 0</div></div></div>' +
    '<div class="sub">' + (r.fact ? 'Margen neto ' + pct(r.neta / r.fact) : '') + '</div>' + (tieneAnt ? chipDif(r.neta, a.neta, ant) : ''));
  var max = r.top.length ? Math.max.apply(null, r.top.map(function(p){ return Math.abs(p.gan); })) || 1 : 1;
  s.push('<div class="eti">Lo que más ganancia dejó</div><div class="bars">' + (r.top.length ? r.top.map(function(p){
    return '<div class="bar"><div class="t"><span>' + esc(p.nombre) + ' · ' + p.unid + ' u.</span><b>' + money(p.gan) + '</b></div><div class="p"><i data-w="' + Math.max(3, Math.round(Math.abs(p.gan) / max * 100)) + '"></i></div></div>';
  }).join('') : '<div class="sub">Sin ventas este mes</div>') + '</div>');
  var pp = totPrem ? r.prem.f / totPrem : 0;
  s.push('<div class="eti">Clásica vs Premium</div><div class="bars">' +
    '<div class="bar"><div class="t"><span>Clásica · ' + r.clas.n + ' u.</span><b>' + money(r.clas.f) + '</b></div><div class="p"><i class="gr" data-w="' + Math.round((1 - pp) * 100) + '"></i></div></div>' +
    '<div class="bar"><div class="t"><span>Premium · ' + r.prem.n + ' u.</span><b>' + money(r.prem.f) + '</b></div><div class="p"><i data-w="' + Math.round(pp * 100) + '"></i></div></div></div>' +
    '<div class="sub">' + (totPrem ? 'Premium es el ' + pct(pp) + ' de lo facturado' : '') + '</div>');
  s.push('<div class="eti">Compras a proveedores</div><div class="gran" data-n="' + Math.round(r.compras) + '" data-f="money">$ 0</div>' +
    '<div class="sub">' + r.nCompras + ' compras en el mes</div>' +
    '<div class="chip ' + (r.pend > 0 ? 'baja' : 'sube') + '">' + (r.pend > 0 ? 'Pendiente de pago: ' + money(r.pend) + ' (' + r.nPend + ')' : 'Sin deuda con proveedores') + '</div>');
  s.push('<div class="l3d-slot mini" style="width:100%;margin-bottom:2vh"></div><div class="gran scr" style="font-size:clamp(40px,8vw,110px)">¡Gracias!</div><div class="sub">Cierre de ' + esc(mt) + ' · Tammaro Distribuidora</div>');
  return s;
}
function presentarMes(m){
  if (!m) return;
  cerrarPres();
  var meses = {}; lista(S.ventas).forEach(function(v){ if (mesDe(v.fecha)) meses[mesDe(v.fecha)] = 1; });
  var orden = Object.keys(meses).sort().reverse();
  var el = document.createElement('div'); el.className = 'pres'; el.id = 'pres';
  el.innerHTML = '<button class="cerrar" id="pxCerrar" title="Cerrar (Esc)">✕</button><div id="pxSlides"></div>' +
    '<div class="ctl"><select id="pxMes">' + orden.map(function(x){ return '<option value="' + x + '"' + (x === m ? ' selected' : '') + '>' + esc(mesTexto(x)) + '</option>'; }).join('') + '</select>' +
    '<button id="pxPrev">‹</button><div class="pts" id="pxPts"></div><button id="pxNext">›</button><button id="pxFull" title="Pantalla completa">⛶</button></div>';
  document.body.appendChild(el);
  P = { i: 0, m: m, n: 0, ts: 0 };
  armarPres();
  $('pxCerrar').onclick = cerrarPres;
  $('pxPrev').onclick = function(){ irSlide(P.i - 1); };
  $('pxNext').onclick = function(){ irSlide(P.i + 1); };
  $('pxMes').onchange = function(){ P.m = this.value; P.i = 0; armarPres(); };
  $('pxFull').onclick = function(){ if (document.fullscreenElement) document.exitFullscreen(); else if (el.requestFullscreen) el.requestFullscreen(); };
  el.addEventListener('touchstart', function(e){ P.ts = e.touches[0].clientX; }, { passive: true });
  el.addEventListener('touchend', function(e){ var d = e.changedTouches[0].clientX - P.ts; if (Math.abs(d) > 50) irSlide(P.i + (d < 0 ? 1 : -1)); }, { passive: true });
  document.addEventListener('keydown', teclasPres);
}
function armarPres(){
  var sl = slidesDe(P.m); P.n = sl.length;
  $('pxSlides').innerHTML = sl.map(function(h){ return '<div class="sl">' + h + '</div>'; }).join('');
  Array.prototype.forEach.call($('pxSlides').querySelectorAll('.l3d-slot'), logo3D);
  $('pxPts').innerHTML = sl.map(function(_, i){ return '<i data-i="' + i + '"></i>'; }).join('');
  irSlide(P.i);
}
function irSlide(i){
  if (!P) return;
  i = Math.max(0, Math.min(P.n - 1, i)); P.i = i;
  Array.prototype.forEach.call($('pxSlides').children, function(n, k){ n.classList.toggle('act', k === i); });
  Array.prototype.forEach.call($('pxPts').children, function(n, k){ n.classList.toggle('on', k === i); });
  $('pxPrev').disabled = i === 0; $('pxNext').disabled = i === P.n - 1;
  animarSlide($('pxSlides').children[i]);
}
function animarSlide(sl){
  Array.prototype.forEach.call(sl.querySelectorAll('[data-n]'), function(n){
    var fin = +n.dataset.n, t0 = performance.now(), dur = 1100;
    (function paso(t){ var k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3); n.textContent = money(fin * e); if (k < 1 && n.isConnected) requestAnimationFrame(paso); })(t0);
  });
  Array.prototype.forEach.call(sl.querySelectorAll('[data-w]'), function(b){ b.style.width = '0'; setTimeout(function(){ b.style.width = b.dataset.w + '%'; }, 80); });
}
function teclasPres(e){
  if (!P) return;
  if (e.key === 'Escape') cerrarPres();
  else if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown'){ e.preventDefault(); irSlide(P.i + 1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp'){ e.preventDefault(); irSlide(P.i - 1); }
  else if (e.key === 'f' || e.key === 'F') $('pxFull').click();
}
function cerrarPres(){
  var el = $('pres'); if (el) el.remove();
  if (document.fullscreenElement) document.exitFullscreen();
  document.removeEventListener('keydown', teclasPres); P = null;
}
</script>
