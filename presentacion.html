<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tammaro · Presentación</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,700;1,800&family=Yellowtail&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{color:#fff;font-family:'Montserrat',system-ui,sans-serif;overflow:hidden;
  background:radial-gradient(ellipse at 75% 15%,#4a1b09 0%,#1a1a1a 55%,#0d0d0d 100%)}
.todo{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4vh 5vw;text-align:center}
.eti{font-style:italic;font-weight:800;font-size:clamp(11px,1.5vw,17px);letter-spacing:.38em;text-transform:uppercase;color:#A0A0A0}
.hint{margin-top:2.5vh;color:#8a8a8a;font-size:clamp(12px,1.4vw,16px)}
.acciones{position:fixed;bottom:18px;left:0;right:0;display:flex;gap:12px;justify-content:center}
.acciones a,.acciones button{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:24px;padding:10px 18px;font:inherit;font-style:italic;font-weight:800;letter-spacing:.03em;text-decoration:none;cursor:pointer;font-size:14px}
.acciones a:hover,.acciones button:hover{background:#E84820}
/* logo 3D */
.l3d-wrap{width:100%;max-width:min(900px,88vw);margin:0 auto;touch-action:none;cursor:grab;user-select:none}
.l3d-wrap:active{cursor:grabbing}
.l3d-esc{perspective:1300px}
.l3d-obj{position:relative;width:100%;aspect-ratio:1202/446;transform-style:preserve-3d;will-change:transform}
.l3d-capa{position:absolute;inset:0;background:url(logo.png) center/contain no-repeat}
.l3d-sombra{width:68%;height:30px;margin:26px auto 0;background:radial-gradient(ellipse at center,rgba(232,72,32,.5),transparent 70%);filter:blur(9px)}
</style>
</head>
<body>
<div class="todo">
  <div class="eti">Presentación</div>
  <div id="logo" style="width:100%;margin-top:3vh"></div>
  <div class="hint">Arrastrá para girar el logo</div>
</div>
<div class="acciones">
  <button id="full">⛶ Pantalla completa</button>
  <a href="index.html">Entrar al sistema</a>
</div>
<script>
/* Logo 3D: apila varias copias del logo real con profundidad (CSS 3D),
   se mueve solo con un vaivén y se gira arrastrando. */
function logo3D(wrap){
  var N = 30, paso = 2.1;
  wrap.classList.add('l3d-wrap');
  wrap.innerHTML = '<div class="l3d-esc"><div class="l3d-obj"></div><div class="l3d-sombra"></div></div>';
  var obj = wrap.querySelector('.l3d-obj'), h = '';
  for (var i = N; i >= 0; i--){
    var br = i === 0 ? 1 : 0.78 - 0.42 * (i / N);
    h += '<div class="l3d-capa" style="transform:translateZ(' + (-i * paso) + 'px);filter:brightness(' + br.toFixed(2) + ')"></div>';
  }
  obj.innerHTML = h;
  var ry = 0, rx = -6, arrastrando = false, ult = 0, x0 = 0, y0 = 0, t0 = performance.now();
  function cuadro(t){
    if (!arrastrando && t - ult > 2200){ ry = 34 * Math.sin((t - t0) / 1700); rx = -6 + 5 * Math.sin((t - t0) / 2300); }
    obj.style.transform = 'rotateX(' + rx.toFixed(1) + 'deg) rotateY(' + ry.toFixed(1) + 'deg)';
    requestAnimationFrame(cuadro);
  }
  wrap.addEventListener('pointerdown', function(e){ arrastrando = true; x0 = e.clientX; y0 = e.clientY; try { wrap.setPointerCapture(e.pointerId); } catch (_){} });
  wrap.addEventListener('pointermove', function(e){ if (!arrastrando) return; ry += (e.clientX - x0) * 0.6; rx = Math.max(-40, Math.min(40, rx - (e.clientY - y0) * 0.4)); x0 = e.clientX; y0 = e.clientY; ult = performance.now(); });
  function soltar(){ arrastrando = false; ult = performance.now(); ry = ((ry % 360) + 360) % 360; if (ry > 180) ry -= 360; }
  wrap.addEventListener('pointerup', soltar); wrap.addEventListener('pointercancel', soltar);
  requestAnimationFrame(cuadro);
}
logo3D(document.getElementById('logo'));
document.getElementById('full').onclick = function(){ if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); };
</script>
</body>
</html>
